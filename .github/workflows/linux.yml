name: Linux build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    name: Debian 13 package
    runs-on: ubuntu-24.04
    container:
      image: debian:13
    steps:
      - name: Install system libraries
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            build-essential \
            pkg-config \
            libdbus-1-dev \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libx11-dev \
            libxcb1-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libegl1-mesa-dev

      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build and pack
        run: |
          chmod +x build_linux.sh packaging/linux/build_deb.sh packaging/linux/install.sh packaging/linux/uninstall.sh
          ./build_linux.sh

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: ECGStudio-linux
          path: |
            dist/ECGStudio-linux-*.tar.gz
            dist/ecg-studio_*.deb
          if-no-files-found: error
